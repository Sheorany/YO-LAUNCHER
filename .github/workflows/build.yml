name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: MinimalLauncher-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK as a download on the Releases page
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk MinimalLauncher.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest MinimalLauncher.apk \
            --title "Minimal Launcher (latest build)" \
            --notes "Tap MinimalLauncher.apk below to download and install." \
            --target "$GITHUB_SHA" --latest
